<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#04050F" />
  <title>ArtaTrade · Operator Console</title>
  <!-- Tema B "X / ink" (29 Okt 2026): Inter (UI), JetBrains Mono (angka),
       Noto Serif JP 700 (judul display). Non-blocking, display=swap. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+JP:wght@700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+JP:wght@700&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+JP:wght@700&display=swap">
  </noscript>
  <style>
    /* Latar & font cadangan dimuat lebih awal supaya tidak ada "flash" teks
       dengan font default lalu tertukar. Font cadangan: system UI + mono sistem. */
    html { background: #04050F; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .mono, code, pre, table {
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    /* Placeholder paint pertama — mencegah layout shift saat chunk dimuat. */
    #root:empty::after {
      content: 'MEMUAT KONSOL…';
      display: block;
      padding: 48px 16px;
      text-align: center;
      color: #5C6890;
      font: 500 12px/1.6 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      letter-spacing: .12em;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Debug: tangkap semua error JS dan tampilkan di halaman
    window.addEventListener('error', function(e) {
      var el = document.getElementById('root');
      if (el) el.innerHTML = '<pre style="color:#f66;padding:20px;font-size:13px;white-space:pre-wrap">JS ERROR: ' + e.message + '\n' + (e.filename||'') + ':' + (e.lineno||'') + '</pre>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('root');
      if (el) el.innerHTML = '<pre style="color:#f66;padding:20px;font-size:13px;white-space:pre-wrap">PROMISE ERROR: ' + e.reason + '</pre>';
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
