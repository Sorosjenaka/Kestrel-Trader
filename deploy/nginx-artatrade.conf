# /etc/nginx/sites-available/artatrade.conf
# Nginx Reverse Proxy & WebSocket Configuration untuk ArtaTrade AI

server {
    listen 80;
    server_name trading.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trading.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/trading.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static Web Frontend
    root /opt/artatrade/apps/web/dist;
    index index.html;

    # Dokumen blueprint statis (bertahan setelah build web; disajikan dari docs/)
    location = /blueprint-perbaikan.html { alias /opt/kestrel/docs/blueprint/blueprint-perbaikan.html; }
    location = /rencana-perbaikan.html { alias /opt/kestrel/docs/blueprint/rencana-perbaikan.html; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Express
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout NFR-01 scanner & streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket Stream Proxy (jika ada lokal stream bridge)
    location /ws/ {
        proxy_pass http://127.0.0.1:8787/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
