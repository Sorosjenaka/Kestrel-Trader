# deploy/nginx-gzip-http.conf
# 24 Okt 2026 — snippet gzip untuk blok `http` di /etc/nginx/nginx.conf.
#
# MASALAH: /etc/nginx/nginx.conf punya `gzip on;` tetapi baris `gzip_types`
# DI-KOMENTARI. Default nginx untuk gzip_types hanya "text/html" — jadi
# file .js / .css / .json dilayani TANPA kompresi. Terverifikasi:
#   curl -H "Accept-Encoding: gzip" .../assets/react-Cppwi8wa.js
#   -> tanpa header Content-Encoding, 218.962 byte mentah.
# Bundle vendor react = 219 KB (68 KB kalau digzip) — jadi ini impair
# langsung keMuatan awal halaman.
#
# CARA PAKAI (perlu sudo):
#   1. Backup:  sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak
#   2. Salin blok di bawah ke dalam blok `http { ... }` (ganti blok gzip
#      yang lama — blok ini akan menggantikannya).
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Verifikasi:
#      curl -sI -H "Accept-Encoding: gzip" http://127.0.0.1/assets/react-Cppwi8wa.js | grep -i content-encoding
#      -> harus: Content-Encoding: gzip
#
# CATATAN: jangan menyalin `deploy/nginx-artatrade.conf` ke sites-available/
# sebagai gantinya — file itu TEMPLATE (trading.yourdomain.com, TLS 443,
# root /opt/artatrade) dan TIDAK punya blok 403 untuk 9 route mutasi.
# Config yang AKTIF adalah /etc/nginx/sites-available/artatrade.hardened.
# Lihat docs/ARSITEKTUR-MAP-2026-10-20/06-watchdog-tools-riset.md.

	gzip on;

	# 24 Okt 2026 (performa): gzip_types sebelumnya DI-KOMENTARI -> hanya
	# text/html yang dikompresi; JS/CSS/JSON dilayani mentah (vendor react
	# 219 KB). gzip_static: pakai file .gz hasil pre-compress (dibuat saat
	# build) kalau ada, sehingga nginx tidak perlu gzip ulang tiap request
	# -- penting di mesin ini yang CPU-nya sudah terbebani (load ~6, 2.3 GB
	# swap terpakai).
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_static on;
	gzip_types text/plain text/css text/xml text/javascript application/xml application/json application/javascript application/x-javascript application/rss+xml image/svg+xml font/woff font/woff2 application/font-woff application/vnd.ms-fontobject application/wasm;

# CATATAN soal gzip_static + SSE:
#   SSE memakai Content-Type "text/event-stream" yang TIDAK ada di
#   gzip_types -> stream TIDAK dikompresi. Jangan tambahkan text/event-stream
#   ke daftar di atas, atau stream jadi tertahan buffer.
