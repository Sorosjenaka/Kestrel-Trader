uar + proteksi</text><rect x="1010" y="395" width="215" height="125" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1117.5" y="419" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Modul</text><text x="1117.5" y="440" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Pembelajaran</text><text x="1117.5" y="462" text-anchor="middle" font-size="12.5" fill="#475569">[Komponen]</text><text x="1117.5" y="485" text-anchor="middle" font-size="12" fill="#334155">Evaluasi hasil + backtest</text><line x1="490" y1="247" x2="508" y2="247" stroke="#64748b" stroke-width="2" /><path d="M 501 241 L 516 247 L 501 253" fill="none" stroke="#64748b" stroke-width="2"/><line x1="735" y1="247" x2="753" y2="247" stroke="#64748b" stroke-width="2" /><path d="M 746 241 L 761 247 L 746 253" fill="none" stroke="#64748b" stroke-width="2"/><line x1="980" y1="247" x2="998" y2="247" stroke="#64748b" stroke-width="2" /><path d="M 991 241 L 1006 247 L 991 253" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="1117.5,310 1117.5,352.5 382.5,352.5 382.5,387" fill="none" stroke="#64748b" stroke-width="2"/><path d="M 376.5 375 L 382.5 387 L 388.5 375" fill="none" stroke="#64748b" stroke-width="2"/><rect x="843.5" y="339.5" width="248.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0"/><text x="967.5" y="352.5" text-anchor="middle" font-size="11.5" fill="#334155">kandidat lolos semua gerbang</text><line x1="490" y1="457" x2="508" y2="457" stroke="#64748b" stroke-width="2" /><path d="M 501 451 L 516 457 L 501 463" fill="none" stroke="#64748b" stroke-width="2"/><line x1="735" y1="457" x2="753" y2="457" stroke="#64748b" stroke-width="2" /><path d="M 746 451 L 761 457 L 746 463" fill="none" stroke="#64748b" stroke-width="2"/><line x1="980" y1="457" x2="998" y2="457" stroke="#64748b" stroke-width="2" /><path d="M 991 451 L 1006 457 L 991 463" fill="none" stroke="#64748b" stroke-width="2"/><rect x="1300" y="330" wid